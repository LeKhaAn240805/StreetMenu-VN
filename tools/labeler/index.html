<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VietMenu Labeler</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#e2e5ea;--text:#1d2330;--muted:#6b7280;--acc:#2563eb;--acc2:#dbeafe;
  --ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--err:#b91c1c;--errbg:#fee2e2;--chip:#eef2f7;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;color:var(--text)}
button:hover{border-color:#b8c0cc}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:1px 6px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:#fff;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
textarea{resize:vertical}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
header .sp{flex:1}
#saveState{color:var(--muted);font-size:12px;min-width:120px;text-align:right}
main{display:grid;grid-template-columns:230px 1fr 600px;min-height:0}
main.collapsedList{grid-template-columns:0 1fr 600px}
#list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#listTools{padding:6px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line)}
#listStats{font-size:12px;color:var(--muted)}
#files{overflow:auto;flex:1}
.fi{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #f0f2f5;cursor:pointer;white-space:nowrap}
.fi:hover{background:#f3f6fb}
.fi.sel{background:var(--acc2)}
.fi .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#cbd5e1}
.dot.draft{background:#f59e0b}.dot.done{background:#16a34a}.dot.needs_review{background:#dc2626}
.badge{font-size:10px;padding:0 5px;border-radius:8px;background:var(--chip);color:var(--muted)}
.badge.new{background:#e0e7ff;color:#3730a3}.badge.chg{background:var(--warnbg);color:var(--warn)}
#viewer{position:relative;overflow:hidden;background:#2a2f38;min-height:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
#stage img{display:block;pointer-events:none}
#overlay{position:absolute;left:0;top:0;pointer-events:none}
#vtools{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:5;flex-wrap:wrap}
#vtools button{background:rgba(255,255,255,.92)}
#vinfo{position:absolute;left:8px;bottom:8px;color:#e5e7eb;font-size:12px;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:5px;z-index:5;max-width:90%}
#drawHint{position:absolute;right:8px;top:8px;background:#fde68a;color:#7c2d12;padding:4px 8px;border-radius:6px;z-index:6;display:none}
#viewer.drawing{cursor:crosshair}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;text-align:center;padding:30px}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;align-items:flex-end}
#tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;background:none}
#tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
#tabs .sp{flex:1}
#pane{overflow:auto;flex:1;padding:10px}
#sideFoot{border-top:1px solid var(--line);padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;color:#374151;font-weight:600;display:flex;gap:4px;align-items:center}
.fld.req label::after{content:"*";color:var(--err)}
.fdesc{display:none;font-size:11.5px;color:var(--muted)}
.fdesc i{color:#475569}
body.showDesc .fdesc{display:block}
.qi{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:10px;align-items:center;justify-content:center;cursor:help;flex:none;font-weight:700}
.bool{flex-direction:row;align-items:center;gap:6px}
.bool label{font-weight:500}
h3{font-size:13px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
h3:first-child{margin-top:0}
.tagGroup{margin-bottom:6px}
.tagGroup b{font-size:11.5px;color:var(--muted);display:block;margin:4px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 7px;border-radius:10px;background:var(--chip);border:1px solid transparent;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#fff}
.chip:hover{border-color:#94a3b8}
.card{border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:8px;background:#fff}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.card.hasErr{border-left:3px solid var(--err)}
.card.hasWarn{border-left:3px solid #f59e0b}
.irow{display:grid;grid-template-columns:30px 58px 1fr 1fr 118px auto;gap:4px;align-items:center}
.irow .num{font-weight:700;color:var(--muted);text-align:center;cursor:pointer}
.iflags{display:flex;gap:6px;align-items:center;font-size:11.5px;margin:4px 0 0 32px;flex-wrap:wrap}
.iflags label{display:flex;gap:3px;align-items:center}
.adv{margin:6px 0 0 32px;padding:6px;background:#f8fafc;border-radius:6px;display:none}
.card.open .adv{display:block}
table.offers{width:calc(100% - 32px);margin:6px 0 0 32px;border-collapse:collapse;table-layout:fixed}
table.offers th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.offers th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:0 2px}
table.offers td{padding:1px 2px}
table.offers input,table.offers select{width:100%;padding:2px 4px;font-size:12px}
table.offers td.x{overflow:hidden}
.meta{max-width:100%;overflow:hidden;text-overflow:ellipsis}
tr.oadv td{background:#f8fafc}
tr.oadv .grid2{grid-template-columns:repeat(4,1fr);gap:4px 6px;padding:4px}
.sec{display:grid;grid-template-columns:44px 1fr 1fr 1fr 24px;gap:4px;margin-bottom:4px}
.msg{padding:6px 8px;border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:12.5px}
.msg.error{background:var(--errbg);color:var(--err)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.help table{border-collapse:collapse;width:100%;font-size:12px}
.help td,.help th{border-bottom:1px solid var(--line);padding:4px;vertical-align:top;text-align:left}
.help code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:11.5px}
.muted{color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tip{position:fixed;z-index:100;max-width:380px;background:#111827;color:#f9fafb;padding:7px 9px;border-radius:7px;font-size:12px;line-height:1.45;pointer-events:none;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tip b{color:#93c5fd}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal>div{background:#fff;border-radius:10px;padding:16px;max-width:620px;width:92%;max-height:86vh;overflow:auto}
.welcome{max-width:640px;color:#e5e7eb;line-height:1.6}
.welcome h2{color:#fff}
.welcome code{background:#3b4252;padding:1px 5px;border-radius:4px}
.cnt{font-size:11px;background:var(--errbg);color:var(--err);border-radius:8px;padding:0 6px;margin-left:4px}
.cnt.w{background:var(--warnbg);color:var(--warn)}
.ir{display:grid;grid-template-columns:1fr auto auto;gap:4px;margin-bottom:4px;align-items:center}
@media (max-width:1250px){main{grid-template-columns:190px 1fr 540px}}
.meta{font-size:11px;padding:1px 5px;border-radius:5px;background:var(--chip);color:#475569;white-space:nowrap;cursor:pointer;border:none}
.meta.nd{background:#e0e7ff;color:#3730a3}
</style>
</head>
<body class="showDesc">
<div id="app">
<header>
  <h1>🍜 VietMenu Labeler</h1>
  <button id="btnOpen" class="pri" title="Chọn thư mục chứa ảnh (ví dụ D:\menus\images)">📂 Mở thư mục ảnh</button>
  <button id="btnReopen" style="display:none"></button>
  <span class="muted" id="folderName"></span>
  <label class="row muted">Người gán: <input id="annotator" size="10" placeholder="vd: An"></label>
  <button id="btnRescan" title="Quét lại thư mục: thấy ảnh mới, ảnh bị đổi, nhãn mồ côi">🔄 Quét lại</button>
  <button id="btnExport" title="Tải về JSONL + CSV của toàn bộ nhãn">⬇ Xuất</button>
  <button id="btnImport" title="Nạp file JSON/JSONL nhãn (dùng khi trình duyệt không ghi được thư mục)" style="display:none">⬆ Nhập</button>
  <label class="row muted" title="Hiện/ẩn mô tả và ví dụ dưới mỗi trường"><input type="checkbox" id="chkDesc" checked> Mô tả</label>
  <span class="sp"></span>
  <span id="saveState"></span>
</header>
<main id="main">
  <aside id="list">
    <div id="listTools">
      <input id="q" placeholder="Tìm tên file / mã ảnh…">
      <select id="fStatus">
        <option value="">Tất cả</option><option value="none">Chưa gán</option><option value="draft">Nháp</option>
        <option value="done">Xong</option><option value="needs_review">Cần xem lại</option><option value="changed">Ảnh đã đổi</option>
      </select>
      <div id="listStats"></div>
    </div>
    <div id="files"></div>
  </aside>
  <section id="viewer">
    <div id="vtools">
      <button id="vFit" title="Vừa khung (F)">⤢ Vừa</button>
      <button id="vZoomIn" title="Phóng to (+)">＋</button>
      <button id="vZoomOut" title="Thu nhỏ (−)">－</button>
      <button id="v100" title="Kích thước gốc">1:1</button>
      <button id="vRot" title="Xoay 90° (chỉ để xem)">⟳</button>
      <button id="vBoxes" title="Ẩn/hiện khung bao">▭ Khung</button>
      <button id="vList" title="Ẩn/hiện danh sách ảnh">☰</button>
    </div>
    <div id="drawHint">Kéo chuột để vẽ khung. Esc để hủy.</div>
    <div id="stage"><img id="img" alt=""><svg id="overlay"></svg></div>
    <div id="empty"></div>
    <div id="vinfo"></div>
  </section>
  <aside id="side">
    <div id="tabs">
      <button data-tab="image" class="on">Ảnh</button>
      <button data-tab="items">Mục &amp; Món <span id="itemCount" class="muted"></span></button>
      <button data-tab="check">Kiểm tra <span id="chkCount"></span></button>
      <button data-tab="help">Hướng dẫn</button>
      <span class="sp"></span>
    </div>
    <div id="pane"></div>
    <div id="sideFoot">
      <button id="btnPrev" title="Ảnh trước (Alt+←)">◀</button>
      <button id="btnNext" title="Ảnh sau (Alt+→)">▶</button>
      <button id="btnSave" title="Lưu ngay (Ctrl+S)">💾 Lưu</button>
      <button id="btnDone" class="pri" title="Kiểm tra rồi đánh dấu xong">✓ Xong</button>
      <button id="btnReview" title="Đánh dấu cần người khác xem lại">⚑ Cần xem lại</button>
      <span class="sp"></span>
      <button id="btnCopyFrom" title="Lấy nhãn của người gán khác làm bản nháp (dùng khi phân xử)">⧉ Lấy nhãn người khác</button>
    </div>
  </aside>
</main>
</div>
<div id="tip"></div>
<input type="file" id="dirInput" webkitdirectory multiple style="display:none">
<input type="file" id="importInput" accept=".json,.jsonl" multiple style="display:none">
<script>
"use strict";
const DEFAULT_CONFIG = {"schema_version": "3.0", "note": "File cấu hình nhãn. Sửa file này (đặt ở <thư mục ảnh>/_labels/schema_config.json) để đổi danh mục, thẻ, mô tả mà không cần sửa code.", "price_min_warn": 1000, "price_max_warn": 5000000, "image_fields": [{"key": "image_id", "label": "Mã ảnh", "type": "text", "desc": "Mã ẩn danh, không đổi khi đổi tên file. Mặc định tự sinh từ tên file.", "example": "smv_0031 (cho 31.jpg)"}, {"key": "group_id", "label": "Mã quán (group_id)", "type": "text", "desc": "Mọi ảnh của cùng một quán/cùng một menu dùng chung mã, và phải nằm cùng một tập (dev/test). Không dùng ảnh này để sửa nhãn ảnh kia.", "example": "12.jpg và 13.jpg là cùng trang COMBO → cùng G012; 16.jpg và 17.jpg cùng menu Ghai Market"}, {"key": "near_duplicate_of", "label": "Gần trùng với ảnh", "type": "text", "desc": "Nếu ảnh này chụp lại gần như cùng nội dung với ảnh khác (khác góc/cắt), ghi file_name của ảnh kia. Khi chấm chỉ giữ một ảnh trong test.", "example": "13.jpg gần trùng 12.jpg"}, {"key": "split", "label": "Tập", "type": "select", "options": ["unassigned", "dev", "test", "ood"], "desc": "dev: ảnh dùng làm ví dụ/hiệu chuẩn; test: ảnh đóng băng để chấm; ood: không phải menu đồ ăn uống. Để unassigned khi chưa chia.", "example": "19 ảnh mẫu S01–S19 → dev; biển thuê xe → ood"}, {"key": "ccl", "label": "Mức CCL", "type": "select", "options": ["", "1", "2", "3", "4"], "desc": "Mức phức tạp ngữ cảnh CAO NHẤT có trong ảnh. Kiểm tra theo thứ tự 4 → 3 → 2 → 1. Để trống nếu OOD.", "example": "30.jpg (in rõ, mỗi món 1 giá cùng dòng) = 1; 4.jpg (Lươn Xứ Nghệ, có 'Gà Chặt (1/2 Con)') = 3; IMG_1397 (giấy dán viết tay phủ nhóm dòng) = 4", "help": "ccl"}, {"key": "tags", "label": "Thẻ hiện tượng", "type": "tags", "desc": "Chọn MỌI hiện tượng có trong ảnh (đa nhãn). 22 thẻ gộp, mỗi nhóm ứng với một loại ngữ cảnh trong bài. Rê chuột lên thẻ để xem định nghĩa, ví dụ và các mã cũ đã gộp.", "example": "IMG_1454: P_IMPLICIT_K, L_VARIANT, N_FOREIGN; IMG_1397: P_INHERITED, P_MULTI_UNLABELED, P_HANDWRITTEN_OVERRIDE, V_HANDWRITING"}, {"key": "venue_tier", "label": "Loại cơ sở", "type": "select", "options": ["", "street_vendor", "small_shop", "chain", "supermarket_foodcourt"], "desc": "street_vendor: xe đẩy, gánh, vỉa hè; small_shop: quán/tiệm độc lập; chain: chuỗi có thương hiệu (KFC, Lotteria, McCafé, Sukiya…); supermarket_foodcourt: quầy trong siêu thị/food court. Dùng để báo kết quả riêng cho 'đường phố' và kiểm tra rò rỉ dữ liệu (menu chuỗi có thể đã có trên mạng).", "example": "temp_image_9A03… (xe bánh xèo) = street_vendor; 6.jpg (KFC) = chain; IMG_1470 (quầy K-Style trong Emart) = supermarket_foodcourt"}, {"key": "venue_type", "label": "Loại hình", "type": "select", "options": ["", "cà phê", "trà sữa", "nước ép – sinh tố", "ăn vặt", "cơm", "bún – phở – hủ tiếu", "bánh mì – xôi", "quán nhậu – ốc", "tiệm bánh – tráng miệng", "lẩu – nướng", "nhà hàng", "fast food", "khác"], "desc": "Loại hình chính của quán.", "example": "IMG_1422 Hủ tiếu Chú Hải = bún – phở – hủ tiếu"}, {"key": "medium", "label": "Chất liệu / dạng menu", "type": "select", "options": ["", "in sẵn để bàn", "sổ menu (trang)", "bảng đèn", "băng rôn / bảng hiệu", "giấy in dán tạm", "viết tay trên giấy", "bảng phấn / kính", "poster một món", "phiếu gọi món (có cột SL)", "khác"], "desc": "Vật mang menu.", "example": "IMG_1481 = bảng phấn / kính; IMG_1464, IMG_1475 = phiếu gọi món; IMG_1469 = poster một món"}, {"key": "lighting", "label": "Ánh sáng", "type": "select", "options": ["", "đủ sáng", "thiếu sáng", "lóa / phản chiếu", "ngược sáng"], "desc": "Điều kiện sáng nổi bật nhất.", "example": "temp_image_78CF… (bảng đèn lóa) = lóa / phản chiếu"}, {"key": "angle", "label": "Góc chụp", "type": "select", "options": ["", "thẳng", "nghiêng nhẹ", "nghiêng mạnh", "cong / gấp"], "desc": "Góc chụp so với mặt menu.", "example": "28.jpg = nghiêng nhẹ; 18.jpg (trang sổ cong) = cong / gấp"}, {"key": "source", "label": "Nguồn ảnh", "type": "select", "options": ["", "tự chụp", "người khác gửi", "ảnh chụp màn hình"], "desc": "Phục vụ phần đạo đức dữ liệu trong bài.", "example": "IMG_14xx.PNG thường là ảnh chụp màn hình"}, {"key": "city", "label": "Thành phố", "type": "text", "desc": "Chỉ ghi thành phố (có thể thêm quận). Không ghi địa chỉ chi tiết.", "example": "Đà Lạt; TP.HCM – Thủ Đức"}, {"key": "languages", "label": "Ngôn ngữ", "type": "list", "desc": "Mã ngôn ngữ xuất hiện trên menu, phân cách bằng dấu phẩy.", "example": "vi, en, ko (20.jpg có tiếng Hàn); vi, en, th (16.jpg có tiếng Thái)"}, {"key": "price_unit_default", "label": "Quy ước giá", "type": "select", "options": ["", "k_vnd", "vnd", "mixed"], "desc": "k_vnd: số trên menu là nghìn đồng ('30' = 30.000 đ, '15k'); vnd: ghi đủ ('65.000'); mixed: cả hai. Web dùng trường này để tự tính price_vnd.", "example": "IMG_1454 ('30', '25 / 40') = k_vnd; 4.jpg ('75.000') = vnd"}, {"key": "tax_note", "label": "Ghi chú thuế", "type": "select", "options": ["", "not_stated", "included", "excluded"], "desc": "Menu có ghi giá đã/chưa gồm VAT không. Không cộng VAT vào price_vnd; chỉ ghi lại.", "example": "20.jpg 'Giá trên chưa bao gồm 10% VAT' = excluded; IMG_1355 '*Giá trên đã bao gồm thuế VAT' = included"}, {"key": "has_prices", "label": "Menu có giá", "type": "bool", "desc": "Bỏ chọn nếu cả menu chỉ có tên món, không có giá. Ảnh này chỉ dùng để chấm tên món.", "example": "IMG_1414 (Gỏi đu đủ), IMG_1483 (Kem tươi, xoài lắc…) = không có giá"}, {"key": "pii_present", "label": "Có thông tin cá nhân", "type": "bool", "desc": "SĐT, QR/số tài khoản, mặt người, địa chỉ, Wi-Fi. Không gán nội dung này thành món.", "example": "IMG_1475 có Wi-Fi + mật khẩu + QR"}, {"key": "pii_types", "label": "Loại thông tin cá nhân", "type": "multi", "options": ["phone", "qr_bank", "face", "address", "wifi"], "desc": "Chỉ để kiểm soát việc che trước khi công bố; không gán nội dung.", "example": "IMG_1475: wifi, qr_bank; 35.jpg: address"}, {"key": "redaction_checked", "label": "Đã kiểm tra che", "type": "bool", "desc": "Người thứ hai đã riant_label_unknown", "other"], "desc": "variant_label_unknown: có nhiều giá nhưng menu không nói giá nào ứng với lựa chọn nào.", "example": "Ốc Tỏi 30-35-37-40k/1 con (C98E…): không rõ theo kích cỡ gì → variant_label_unknown"}, {"key": "bbox", "label": "Khung bao", "type": "bbox", "adv": true, "desc": "(Tùy chọn) Vẽ khung quanh tên + giá của món trên ảnh. Dùng cho phân tích không gian ở ảnh CCL-4.", "example": ""}, {"key": "notes", "label": "Ghi chú món", "type": "text", "adv": true, "desc": "", "example": "Gộp 2 dòng '…rum nóng' và '…rum đá'"}], "offer_fields": [{"key": "size", "label": "Size", "type": "text", "desc": "Nhãn size như menu, chuẩn hóa nhẹ: S, M, L, XL, nhỏ, vừa, lớn, P/R/L, 2X, Mega, 500 ml. Nếu có nhiều giá mà menu KHÔNG ghi size, ghi #1, #2, #3 theo thứ tự trái → phải.", "example": "IMG_1356 'Xôi gà xé 20k 25k 30k' → #1, #2, #3; 11.jpg 'P 149.000 R 239.000 L 309.000' → P, R, L"}, {"key": "size_rank", "label": "Thứ hạng size", "type": "int", "adv": true, "desc": "1 = nhỏ nhất. Giúp so sánh các hệ size khác nhau (S/M/L, nhỏ/lớn, P/R/L).", "example": "S=1, M=2, L=3"}, {"key": "temp", "label": "Nóng/đá", "type": "select", "options": ["", "nóng", "đá", "nóng|đá"], "desc": "'nóng|đá' = một giá dùng chung cho cả hai (khi chấm sẽ tách thành 2 offer). Từ 'nóng' nằm trong tên món mà không có bản đá thì giữ trong tên, để trống ở đây.", "example": "'Café đen nóng/ đá 30' → nóng|đá; 'Trà lipton nóng/ đá 25 / 40' → 2 offer: nóng 25.000, đá 40.000"}, {"key": "portion", "label": "Khẩu phần", "type": "text", "desc": "Khẩu phần/số người/vật chứa của MỘT lựa chọn.", "example": "1 người, 2 người; tô; phần (500g bún – 2 người) (IMG_1475); 1/2 con"}, {"key": "quantity", "label": "Số lượng", "type": "num", "adv": true, "desc": "Số đơn vị trong lựa chọn khi giá đổi theo số lượng (bậc số lượng). Dùng cùng qty_unit.", "example": "Gà rán 1 miếng 35.000, 2 miếng 70.000 (6.jpg) → quantity 1, 2; Pygmy Platter (4) 225.000 (25.jpg) → 4"}, {"key": "qty_unit", "label": "Đơn vị SL", let CFG = DEFAULT_CONFIG;
const IMG_EXT = /\.(jpe?g|png|webp|heic|heif|gif|bmp|avif|jfif)$/i;
const LABEL_DIR = "_labels";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- tiny IndexedDB kv ---------------- */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("vietmenu-labeler", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("kv"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("kv", mode); const st = t.objectStore("kv"); const r = fn(st);
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(e => console.warn(e)),
    del: k => tx("readwrite", s => s.delete(k)).catch(() => {}),
    keys: () => tx("readonly", s => s.getAllKeys()).catch(() => []),
  };
})();
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------------- state ---------------- */
const S = {
  mode: null,            // 'fsa' | 'fallback'
  root: null,            // FileSystemDirectoryHandle
  rootName: "",
  images: [],            // [{key, name, file?, handle?, size, mtime}]
  labels: {},            // own labels key -> doc (summary cache, full doc)
  others: {},            // annotator -> Set(keys)
  orphans: [],           // own label docs whose file not found
  cur: -1, doc: null, dirty: false,
  tab: "image", selItem: -1, openItems: new Set(), openOffers: new Set(),
  view: {s: 1, tx: 0, ty: 0, r: 0, showBoxes: true}, natural: {w: 0, h: 0},
  draw: null, fallbackLabels: {}, // fallback: "annot::key" -> doc
};
const annot = () => (($("#annotator").value || "").trim().replace(/[^\p{L}\p{N}_-]/gu, "_") || "anon");
const safeKey = k => k.replace(/[\\/]/g, "__") + ".json";

/* ---------------- tooltip ---------------- */
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block";
  const r = t.getBoundingClientRect(); const w = Math.min(380, tip.offsetWidth);
  let x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left)); let y = r.bottom + 6;
  if (y + tip.offsetHeight > window.innerHeight - 8) y = r.top - tip.offsetHeight - 6;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
const tipHTML = d => `<b>${esc(d.label || d.code || "")}</b>${d.key ? ` <span style="opacity:.6">(${esc(d.key)})</span>` : ""}<br>${esc(d.desc || "")}${d.example ? `<br><b>Ví dụ:</b> ${esc(d.example)}` : ""}${d.merges && d.merges !== d.code ? `<br><span style="opacity:.7">Gộp từ: ${esc(d.merges)}</span>` : ""}`;

/* ---------------- filesystem ---------------- */
async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith(".") || name.startsWith("_")) continue;
    if (h.kind === "directory") await walk(h, prefix + name + "/", out);
    else if (IMG_EXT.test(name)) out.push({key: prefix + name, name, handle: h});
  }
}
async function labelDir(create, who = annot()) {
  const ld = await S.root.getDirectoryHandle(LABEL_DIR, {create});
  return who ? ld.getDirectoryHandle(who, {create}) : ld;
}
async function readJSONHandle(fh) { const f = await fh.getFile(); return JSON.parse(await f.text()); }
async function writeText(dirH, name, text) {
  const fh = await dirH.getFileHandle(name, {create: true});
  const w = await fh.createWritable(); await w.write(text); await w.close();
}

async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const h = await window.showDirectoryPicker({id: "vietmenu", mode: "readwrite"});
      await idb.set("rootHandle", h);
      await useRoot(h);
    } catch (e) { if (e.name !== "AbortError") alert("Không mở được thư mục: " + e.message); }
  } else {
    $("#dirInput").click();
  }
}
async function useRoot(h) {
  S.mode = "fsa"; S.root = h; S.rootName = h.name;
  $("#btnReopen").style.display = "none";
  await loadConfig();
  await scan();
}
async function tryReopen() {
  const h = await idb.get("rootHandle");
  if (!h || !h.queryPermission) return;
  const p = await h.queryPermission({mode: "readwrite"});
  if (p === "granted") { await useRoot(h); return; }
  const b = $("#btnReopen"); b.style.display = ""; b.textContent = `↩ Mở lại “${h.name}”`;
  b.onclick = async () => { if ((await h.requestPermission({mode: "readwrite"})) === "granted") useRoot(h); };
}

/* fallback (Firefox/Safari): read-only folder via <input webkitdirectory>, labels kept in IndexedDB */
$("#dirInput").addEventListener("change", async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  S.mode = "fallback"; S.root = null;
  S.rootName = (files[0].webkitRelativePath || "").split("/")[0] || "thư mục";
  S.fallbackFiles = files;
  $("#btnImport").style.display = "";

  for (const f of files) {
    const parts = (f.webkitRelativePath || f.name).split("/").slice(1);
    if (parts[0] === LABEL_DIR && parts.length === 3 && parts[2].endsWith(".json")) {
      try { const d = JSON.parse(await f.text()); const k = `${parts[1]}::${d.file_name}`;
        if (!(await idb.get("L::" + k))) await idb.set("L::" + k, d); } catch {}
    }
    if (parts[0] === LABEL_DIR && parts[1] === "schema_config.json") { try { CFG = mergeCfg(JSON.parse(await f.text())); } catch {} }
  }

});

async function loadConfig() {
  CFG = DEFAULT_CONFIG;

  try {
    const ld = await S.root.getDirectoryHandle(LABEL_DIR);
    const fh = await ld.getFileHandle("schema_config.json");

  } catch {}
}
function mergeCfg(c) { return Object.assign({}, DEFAULT_CONFIG, c || {}); }

async function scan() {
  const imgs = [];
  if (S.mode === "fsa") await walk(S.root, "", imgs);
  else for (const f of S.fallbackFiles) {
    const parts = (f.webkitRelativePath || f.name).split("/").slice(1);
    if (parts.some(p => p.startsWith("_") || p.startsWith("."))) continue;
    if (IMG_EXT.test(f.name)) imgs.push({key: parts.join("/"), name: f.name, file: f});
  }
  imgs.sort((a, b) => a.key.localeCompare(b.key, undefined, {numeric: true}));
  for (const im of imgs) {
    const f = im.file || await im.handle.getFile();
    im.size = f.size; im.mtime = f.lastModified;
  }
  S.images = imgs;
  await loadAllLabels();
  $("#folderName").textContent = `${S.rootName} · ${imgs.length} ảnh` + (S.mode === "fallback" ? " (chế độ chỉ đọc)" : "");
  renderList();
  if (S.cur < 0 && imgs.length) openImage(0);
  else if (S.cur >= 0) { const k = S.doc?.file_name; const i = S.images.findIndex(x => x.key === k); if (i >= 0) S.cur = i; renderList(); }
  if (!imgs.length) showWelcome("Không tìm thấy ảnh trong thư mục này. Hãy chọn thư mục chứa ảnh (.jpg, .png, .webp, .heic).");
}

async function loadAllLabels() {
  S.labels = {}; S.others = {}; S.orphans = [];
  const me = annot();
  const keys = new Set(S.images.map(i => i.key));
  if (S.mode === "fsa") {
    let ld; try { ld = await S.root.getDirectoryHandle(LABEL_DIR); } catch { return; }
    for await (const [who, h] of ld.entries()) {
      if (h.kind !== "directory") continue;
      for await (const [n, fh] of h.entries()) {
        if (!n.endsWith(".json")) continue;
        try {
          const d = await readJSONHandle(fh);
          if (who === me) { if (keys.has(d.file_name)) S.labels[d.file_name] = d; else S.orphans.push({doc: d, fname: n}); }
          else (S.others[who] ||= new Set()).add(d.file_name);
        } catch (e) { console.warn("Lỗi đọc nhãn", who, n, e); }
      }
    }
  } else {
    for (const k of await idb.keys()) {
      if (!String(k).startsWith("L::")) continue;
      const [, who, ...rest] = String(k).split("::"); const fk = rest.join("::");
      const d = await idb.get(k);
      if (who === me) { if (keys.has(fk)) S.labels[fk] = d; else S.orphans.push({doc: d, fname: fk}); }
      else (S.others[who] ||= new Set()).add(fk);
    }
  }
}

async function saveDoc(force) {

  const d = S.doc; d.updated_at = new Date().toISOString(); d.annotator = annot();
  const text = JSON.stringify(d, null, 2);
  try {
    if (S.mode === "fsa") await writeText(await labelDir(true), safeKey(d.file_name), text);
    else await idb.set(`L::${annot()}::${d.file_name}`, JSON.parse(text));
    S.labels[d.file_name] = JSON.parse(text);
    S.dirty = false;
    $("#saveState").textContent = (S.mode === "fsa" ? "Đã lưu " : "Đã lưu (trình duyệt) ") + new Date().toLocaleTimeString();

}

/* ---------------- hashing / relink ---------------- */
async function sha256(file) {
  const buf = await file.arrayBuffer(); const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const fileOf = im => im.file ? Promise.resolve(im.file) : im.handle.getFile();
async function relinkOrphans() {
  const free = S.images.filter(im => !S.labels[im.key]);
  toast(`Đang so ${free.length} ảnh chưa gán…`);
  const byHash = {};
  for (const im of free) byHash[await sha256(await fileOf(im))] = im;
  let n = 0;
  for (const o of [...S.orphans]) {
    const im = o.doc.file_sha256 && byHash[o.doc.file_sha256];
    if (!im) continue;
    const old = o.doc.file_name; o.doc.file_name = im.key; o.doc.notes = (o.doc.notes ? o.doc.notes + "\n" : "") + `Đổi tên file: ${old} → ${im.key}`;
    if (S.mode === "fsa") { const ld = await labelDir(true); await writeText(ld, safeKey(im.key), JSON.stringify(o.doc, null, 2)); try { await ld.removeEntry(o.fname); } catch {} }
    else { await idb.set(`L::${annot()}::${im.key}`, o.doc); await idb.del(`L::${annot()}::${o.fname}`); }
    n++;
  }
  await loadAllLabels(); renderList();
  alert(n ? `Đã ghép lại ${n} nhãn với ảnh đổi tên.` : "Không tìm thấy ảnh nào có cùng nội dung.");
}

let heicLib;

/* ---------------- viewer ---------------- */
const viewer = $("#viewer"), stage = $("#stage");
function applyView() {
  const {s, tx, ty, r} = S.view;
  stage.style.width = S.natural.w + "px"; stage.style.height = S.natural.h + "px";
  // rotate around image centre
  const cx = S.natural.w / 2, cy = S.natural.h / 2;
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${s}) translate(${cx}px,${cy}px) rotate(${r}deg) translate(${-cx}px,${-cy}px)`;
}
function fit() {
  const W = viewer.clientWidth, H = viewer.clientHeight; const rot = S.view.r % 180 !== 0;
  const w = rot ? S.natural.h : S.natural.w, h = rot ? S.natural.w : S.natural.h;
  if (!w || !h) return;
  const s = Math.min((W - 20) / w, (H - 20) / h);
  S.view.s = s; S.view.tx = (W - S.natural.w * s) / 2; S.view.ty = (H - S.natural.h * s) / 2; applyView();
}
function zoomAt(f, cx, cy) {
  const v = S.view; const ns = Math.max(0.05, Math.min(12, v.s * f)); const k = ns / v.s;
  v.tx = cx - (cx - v.tx) * k; v.ty = cy - (cy - v.ty) * k; v.s = ns; applyView();
}
viewer.addEventListener("wheel", e => { e.preventDefault(); const r = viewer.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
function toImg(e) {
  const m = new DOMMatrix(getComputedStyle(stage).transform).inverse();
  const r = viewer.getBoundingClientRect(); const p = m.transformPoint(new DOMPoint(e.clientX - r.left, e.clientY - r.top));
  return {x: Math.max(0, Math.min(S.natural.w, p.x)), y: Math.max(0, Math.min(S.natural.h, p.y))};
}
let drag = null;
viewer.addEventListener("mousedown", e => {
  if (e.target.closest("#vtools")) return;
  if (S.draw) { const p = toImg(e); drag = {mode: "draw", x0: p.x, y0: p.y}; e.preventDefault(); return; }
  drag = {mode: "pan", x: e.clientX, y: e.clientY, tx: S.view.tx, ty: S.view.ty};
});
window.addEventListener("mousemove", e => {
  lastAct = Date.now();
  if (!drag) return;
  if (drag.mode === "pan") { S.view.tx = drag.tx + e.clientX - drag.x; S.view.ty = drag.ty + e.clientY - drag.y; applyView(); }
  else { const p = toImg(e); drag.box = [Math.min(drag.x0, p.x), Math.min(drag.y0, p.y), Math.abs(p.x - drag.x0), Math.abs(p.y - drag.y0)].map(Math.round); drawOverlay(drag.box); }
});
window.addEventListener("mouseup", () => {
  if (drag?.mode === "draw" && drag.box && drag.box[2] > 3 && drag.box[3] > 3) finishDraw(drag.box);
  drag = null;
});

$("#vZoomIn").onclick = () => zoomAt(1.25, viewer.clientWidth / 2, viewer.clientHeight / 2);
$("#vZoomOut").onclick = () => zoomAt(0.8, viewer.clientWidth / 2, viewer.clientHeight / 2);
$("#v100").onclick = () => { const s = S.view.s; zoomAt(1 / s, viewer.clientWidth / 2, viewer.clientHeight / 2); };
$("#vRot").onclick = () => { S.view.r = (S.view.r + 90) % 360; fit(); };

function drawOverlay(tmp) {

/* ---------------- price helpers ---------------- */
function parsePrice(tok, unitDefault) {

}

}

  const um = raw.match(/\/\s*(\d+)?\s*(g|gr|kg|phần|cặp|con|cây|lổ|trứng|dĩa|đĩa|chục|ly|ổ|hộp|cái|xiên|người)\b/i);

}
function autoPrice(path) {
  const [, ii, , oi] = path.split("."); const it = S.doc.items[+ii]; const of = it.offers[+oi];
  const raw = of.raw_price || ""; const toks = extractPrices(raw); if (!toks.length) return;
  const vals = toks.map(t => parsePrice(t, S.doc.price_unit_default));
  if (of.price_kind === "range" && vals.length >= 2) { of.price_min_vnd ??= Math.min(...vals); of.price_max_vnd ??= Math.max(...vals); }

}

}

    name = name.replace(/[.…\s]+$/, "").trim();
    let varList = vars ? vars.split(/[\/,]/).map(s => s.trim()).filter(Boolean) : [];
    if (!varList.length && /nóng\s*\/\s*đá/i.test(name)) varList = ["nóng", "đá"];
    const toks = extractPrices(price); const vals = toks.map(t => parsePrice(t, d.price_unit_default));
    const it = {item_id: nextItemId(), section_id: sectionId || null, item_code: "", raw_name: name, raw_name_2: "", norm_name: name.replace(/^\s*[\d①-⑳]+[.)\-:]?\s+/, "").replace(/\s*nóng\s*\/\s*đá\s*$/i, "").toLowerCase(), alt_norm_names: [], description: "",
      category: "", is_add_on: false, is_combo: false, combo_components: [], serves: "", option_groups: "", attributes: [], availability: "", item_status: "active", legibility: "clear", ambiguous: false, ambig_reason: "", notes: "", offers: []};
    const src = sec?.shared_price_raw && !toks.length ? "section_header" : "item_line";

        <td class="x"><span class="row" style="gap:0;flex-wrap:nowrap">${o.temp === "nóng|đá" ? `<button class="sm ghost" data-act="splitTemp" data-i="${i}" data-j="${j}" title="Tách thành 2 offer nóng / đá (khi hai giá khác nhau)">⇉</button>` : ""}<button class="sm ghost" data-act="delOffer" data-i="${i}" data-j="${j}" title="Xóa offer">✕</button></span></td></tr>`;
      if (S.openOffers.has(i + ":" + j) || ["range", "unit_price", "bundle", "delta"].includes(o.price_kind)) h += `<tr class="oadv"><td colspan="8"><div class="grid2">${["price_kind", "price_source", "evidence"].map(k => fieldHTML(OF(k), `${p}.${k}`, o[k], {})).join("")}${CFG.offer_fields.filter(f => f.adv).map(f => fieldHTML(f, `${p}.${f.key}`, o[f.key], {})).join("")}</div></td></tr>`;
    });
    h += `</table><div style="margin:3px 0 0 32px"><button class="sm" data-act="addOffer" data-i="${i}">＋ offer</button></div></div>`;
  });

  return h;
}

/* ---------------- validation ---------------- */
let vTimer; function scheduleValidate() { clearTimeout(vTimer); vTimer = setTimeout(validateNow, 500); }
function validate(d) {
  const M = []; const E = (msg, path) => M.push({level: "error", msg, path}), W = (msg, path) => M.push({level: "warn", msg, path});
  const lo = CFG.price_min_warn || 1000, hi = CFG.price_max_warn || 5000000;
  if (!d.image_id) E("Thiếu mã ảnh (image_id).");
  if (d.split !== "ood" && d.ccl == null) W("Chưa chọn mức CCL.");
  if (d.split === "ood" && d.ccl != null) W("Ảnh OOD thường để trống CCL.");
  if (!d.tags.length) W("Chưa chọn thẻ hiện tượng nào.");
  if (!d.price_unit_default && d.has_prices) W("Chưa chọn 'Quy ước giá' (k_vnd / vnd / mixed).");
  if (!d.group_id) W("Chưa có group_id (mã quán) — cần để chia tập không rò rỉ.");
  if (!d.venue_tier) W("Chưa chọn 'Loại cơ sở' (đường phố / quán / chuỗi).");
  if (!d.items.length && d.split !== "ood") E("Ảnh chưa có món nào.");
  if (d.pii_present && !(d.pii_types || []).length) W("Có thông tin cá nhân nhưng chưa chọn loại.");
  const secIds = new Set(d.sections.map(s => s.section_id));
  if (secIds.size !== d.sections.length) E("Có mã mục bị trùng.");
  const seen = new Map();
  d.items.forEach((it, i) => {
    const P = `items.${i}`, N = `Món ${i + 1}${it.raw_name ? ` “${it.raw_name}”` : ""}`;
    if (!it.raw_name) E(`${N}: thiếu tên nguyên văn.`, P);
    if (!it.norm_name) E(`${N}: thiếu tên chuẩn hóa.`, P);
    else if (it.norm_name !== it.norm_name.toLowerCase()) W(`${N}: tên chuẩn hóa nên viết thường.`, P);
    if (!it.category) W(`${N}: chưa chọn nhóm món.`, P);
    if (it.section_id && !secIds.has(it.section_id)) E(`${N}: mục “${it.section_id}” không tồn tại.`, P);
    if (it.is_combo && !(it.combo_components || []).length) W(`${N}: combo chưa ghi thành phần.`, P);
    if (it.ambiguous && !it.ambig_reason) W(`${N}: đánh dấu mơ hồ nhưng chưa chọn lý do.`, P);
    if (!it.offers.length) E(`${N}: chưa có offer nào (món không giá vẫn cần 1 offer với giá để trống).`, P);
    if (/^\s*[\d①-⑳]+[.)]?\s/.test(it.norm_name || "")) W(`${N}: tên chuẩn hóa còn số thứ tự.`, P);
    it.offers.forEach((o, j) => {
      const Q = `${P}.offers.${j}`, NO = `${N}, offer ${j + 1}`;
      if (o.price_vnd != null) {
        if (!Number.isInteger(o.price_vnd)) E(`${NO}: giá phải là số nguyên.`, Q);
        if (o.price_vnd < lo || o.price_vnd > hi) W(`${NO}: giá ${o.price_vnd.toLocaleString("vi")} đ có vẻ bất thường (quên ×1000?).`, Q);
        if (!o.raw_price) E(`${NO}: có price_vnd nhưng thiếu giá nguyên văn.`, Q);
        if (o.price_vnd % 100 !== 0 && o.price_kind !== "unit_price") W(`${NO}: giá không tròn trăm (${o.price_vnd}).`, Q);
      } else if (d.has_prices && o.price_kind !== "range" && !it.ambiguous && it.item_status === "active") W(`${NO}: chưa có giá. Nếu menu thật sự không ghi giá, hãy đánh dấu mơ hồ với lý do price_missing_or_misaligned.`, Q);
      if (o.old_price_vnd != null && o.price_vnd != null && o.old_price_vnd <= o.price_vnd && o.evidence !== "overwritten") W(`${NO}: giá cũ không lớn hơn giá mới — kiểm tra lại.`, Q);
      if (o.price_kind === "range") { if (o.price_min_vnd == null || o.price_max_vnd == null) E(`${NO}: price_kind = range cần giá min và max.`, Q); else if (o.price_min_vnd >= o.price_max_vnd) E(`${NO}: giá min phải nhỏ hơn max.`, Q); }
      if ((o.price_kind === "unit_price" || o.price_kind === "bundle") && !o.unit) E(`${NO}: ${o.price_kind} cần ghi đơn vị giá.`, Q);
      if (o.price_kind === "delta" && !it.is_add_on) W(`${NO}: giá delta (+X) thường là món thêm — chọn 'Topping / món thêm'?`, Q);
      if (o.price_source === "section_header" && !(it.section_id && d.sections.find(s => s.section_id === it.section_id)?.shared_price_raw)) W(`${NO}: giá lấy từ tiêu đề mục nhưng mục chưa ghi giá chung.`, Q);
      if (o.evidence === "overwritten" && o.old_price_vnd == null) W(`${NO}: giá viết đè — ghi giá in cũ vào 'Giá cũ' nếu đọc được.`, Q);
      if (/^#\d/.test(o.size || "") && !d.tags.includes("P_MULTI_UNLABELED")) W(`${NO}: dùng size #n — nên thêm thẻ P_MULTI_UNLABELED.`, Q);
      const sig = [it.norm_name, o.size, o.temp, o.portion, o.quantity, o.price_vnd].join("|");
      if (it.norm_name && seen.has(sig)) W(`${NO}: trùng hoàn toàn với ${seen.get(sig)} (L_DUPLICATE: cùng giá thì gộp).`, Q); else seen.set(sig, NO);
    });
    const vs = it.offers.map(o => [o.size, o.temp, o.portion, o.quantity].join("|"));
    if (it.offers.length > 1 && new Set(vs).size < vs.length) W(`${N}: có các offer không phân biệt được (cùng size/nóng-đá/khẩu phần). Thiếu nhãn biến thể?`, P);
  });
  const anyO = f => d.items.some(it => it.offers.some(o => f(o, it)));
  const tagChecks = [
    ["L_COMBO_SET", d.items.some(it => it.is_combo)], ["L_ADDON", d.items.some(it => it.is_add_on)],
    ["P_PROMO", anyO(o => o.old_price_vnd && o.evidence !== "overwritten")], ["P_HANDWRITTEN_OVERRIDE", anyO(o => o.evidence === "overwritten")],
    ["P_UNIT_BUNDLE", anyO(o => ["unit_price", "bundle", "starting_from"].includes(o.price_kind))], ["P_MULTI_UNLABELED", anyO(o => o.price_kind === "range")],
    ["P_INHERITED", anyO(o => ["section_header", "global_header", "column_header", "bracket", "merged_cell"].includes(o.price_source))],
    ["S_DETACHED", anyO(o => o.price_source === "badge")],
    ["L_VARIANT", d.items.some(it => it.offers.length > 1 || it.offers.some(o => o.temp === "nóng|đá"))],
    ["P_MISSING", anyO((o, it) => o.price_vnd == null && o.price_kind !== "range") || !d.has_prices],
    ["V_HANDWRITING", anyO(o => o.evidence === "handwritten")]];
  for (const [t, cond] of tagChecks) if (cond && !d.tags.includes(t)) W(`Nhãn có hiện tượng ${t} nhưng chưa chọn thẻ này.`);
  return M;
}
function validateNow() {
  if (!S.doc) return; S.msgs = validate(S.doc);
  const e = S.msgs.filter(m => m.level === "error").length, w = S.msgs.length - e;
  $("#chkCount").innerHTML = (e ? `<span class="cnt">${e}</span>` : "") + (w ? `<span class="cnt w">${w}</span>` : "");
  if (S.tab === "check") renderPane();
}

/* ---------------- status buttons ---------------- */
$("#btnSave").onclick = () => saveDoc(true);
$("#btnDone").onclick = async () => { if (!S.doc) return; validateNow(); const e = S.msgs.filter(m => m.level === "error").length; if (e && !confirm(`Còn ${e} lỗi ⛔. Vẫn đánh dấu xong?`)) { setTab("check"); return; } S.doc.status = "done"; markDirty(); await saveDoc(true); renderList(); if (S.cur < S.images.length - 1 && confirm("Đã lưu. Sang ảnh tiếp theo?")) openImage(S.cur + 1); };
$("#btnReview").onclick = async () => { if (!S.doc) return; const why = prompt("Ghi lý do cần xem lại (sẽ thêm vào ghi chú ảnh):", ""); if (why === null) return; S.doc.status = "needs_review"; if (why) S.doc.notes = (S.doc.notes ? S.doc.notes + "\n" : "") + "[Xem lại] " + why; markDirty(); await saveDoc(true); renderList(); renderPane(); };
$("#btnPrev").onclick = () => openImage(S.cur - 1);
$("#btnNext").onclick = () => openImage(S.cur + 1);
$("#btnCopyFrom").onclick = async () => {
  if (!S.doc) return; const key = S.doc.file_name;
  const who = Object.keys(S.others).filter(w => S.others[w].has(key));
  if (!who.length) return alert("Chưa có người gán khác nào gán ảnh này.");
  const w = prompt(`Lấy nhãn của ai làm bản nháp? (${who.join(", ")})`, who[0]); if (!w || !who.includes(w)) return;
  if (S.doc.items.length && !confirm("Nhãn hiện tại của bạn sẽ bị thay bằng nhãn của " + w + ". Tiếp tục?")) return;
  let d; if (S.mode === "fsa") d = await readJSONHandle(await (await labelDir(false, w)).getFileHandle(safeKey(key))); else d = await idb.get(`L::${w}::${key}`);
  d.annotator = annot(); d.status = "draft"; d.notes = (d.notes ? d.notes + "\n" : "") + `[Sao chép từ ${w}]`; d.copied_from = w; normalizeDoc(d);
  S.doc = d; markDirty(); renderPane(); drawOverlay(); validateNow();
};

/* ---------------- export / import ---------------- */
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function allLabelDocs(includeOthers) {
  const out = [];
  if (S.mode === "fsa") {
    let ld; try { ld = await S.root.getDirectoryHandle(LABEL_DIR); } catch { return out; }
    for await (const [who, h] of ld.entries()) { if (h.kind !== "directory" || (!includeOthers && who !== annot())) continue;
      for await (const [n, fh] of h.entries()) if (n.endsWith(".json")) try { const d = await readJSONHandle(fh); d.annotator ||= who; out.push(d); } catch {} }
  } else for (const k of await idb.keys()) { if (!String(k).startsWith("L::")) continue; const who = String(k).split("::")[1]; if (!includeOthers && who !== annot()) continue; const d = await idb.get(k); d.annotator ||= who; out.push(d); }
  return out;
}
function toCSV(docs) {
  const cols = ["annotator", "status", "image_id", "file_name", "group_id", "split", "ccl", "venue_tier", "price_unit_default", "tags", "n_offers", "dense", "section_id", "section_title", "item_id", "item_code", "raw_name", "raw_name_2", "norm_name", "alt_norm_names", "category", "is_add_on", "is_combo", "item_status", "legibility", "ambiguous", "ambig_reason", "size", "size_rank", "temp", "portion", "quantity", "qty_unit", "raw_price", "price_vnd", "old_price_vnd", "price_kind", "price_min_vnd", "price_max_vnd", "unit_qty", "unit", "price_source", "evidence"];
  const q = v => { v = Array.isArray(v) ? v.join("|") : (v ?? ""); v = String(v); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = [cols.join(",")];
  for (const d of docs) for (const it of d.items || []) { const sec = (d.sections || []).find(s => s.section_id === it.section_id);
    for (const o of (it.offers?.length ? it.offers : [{}])) { const r = Object.assign({}, d, {n_offers: (d.items || []).reduce((a, x) => a + (x.offers || []).length, 0), dense: (d.items || []).reduce((a, x) => a + (x.offers || []).length, 0) > 60, section_title: sec?.norm_title || sec?.raw_title || ""}, it, o); rows.push(cols.map(c => q(r[c])).join(",")); } }
  return "\ufeff" + rows.join("\n");
}
$("#btnExport").onclick = async () => {
  if (S.dirty) await saveDoc();
  const all = confirm("Xuất nhãn của TẤT CẢ người gán?\nOK = tất cả · Hủy = chỉ của " + annot());
  const docs = await allLabelDocs(all); if (!docs.length) return alert("Chưa có nhãn nào.");
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-"); const tag = all ? "all" : annot();
  download(`vietmenu_labels_${tag}_${stamp}.jsonl`, docs.map(d => JSON.stringify(d)).join("\n"), "application/json");
  setTimeout(() => download(`vietmenu_offers_${tag}_${stamp}.csv`, toCSV(docs), "text/csv"), 400);
};
$("#btnImport").onclick = () => $("#importInput").click();
$("#importInput").addEventListener("change", async e => {
  let n = 0;
  for (const f of e.target.files) { const t = await f.text(); const docs = f.name.endsWith(".jsonl") ? t.split("\n").filter(Boolean).map(l => JSON.parse(l)) : [JSON.parse(t)];
    for (const d of docs) { await idb.set(`L::${d.annotator || annot()}::${d.file_name}`, d); n++; } }
  await loadAllLabels(); renderList(); alert(`Đã nạp ${n} nhãn.`);
});

/* ---------------- misc ---------------- */
function toast(t) { $("#saveState").textContent = t; }
$("#chkDesc").onchange = e => { document.body.classList.toggle("showDesc", e.target.checked); ls.set("showDesc", e.target.checked); };
$("#annotator").value = ls.get("annotator", "");
$("#annotator").addEventListener("change", async () => { ls.set("annotator", $("#annotator").value.trim()); if (S.mode) { if (S.dirty) await saveDoc(); await loadAllLabels(); renderList(); if (S.cur >= 0) openImage(S.cur); } });
$("#btnOpen").onclick = () => { if (!$("#annotator").value.trim()) { const n = prompt("Nhập tên người gán (ví dụ: An, Binh, C):"); if (!n) return; $("#annotator").value = n; ls.set("annotator", n.trim()); } openFolder(); };
$("#btnRescan").onclick = async () => { if (!S.mode) return openFolder(); if (S.dirty) await saveDoc(); await loadConfig(); const before = S.images.length; await scan(); toast(`Quét xong: ${S.images.length} ảnh (${S.images.length - before >= 0 ? "+" : ""}${S.images.length - before})`); };
document.addEventListener("keydown", e => {
  lastAct = Date.now();
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveDoc(true); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); openImage(S.cur + 1); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); openImage(S.cur - 1); }
  else if (e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); if (S.tab !== "items") setTab("items"); ACT.addItem(); }
  else if (e.key === "Escape" && S.draw) { S.draw = null; setDrawHint(); drawOverlay(); }
  else if (!typing && e.key.toLowerCase() === "f") fit();
  else if (!typing && (e.key === "+" || e.key === "=")) $("#vZoomIn").click();
  else if (!typing && e.key === "-") $("#vZoomOut").click();
});
// active-time counter: counts seconds while tab visible and user active within last 90s
setInterval(() => { if (S.doc && !document.hidden && Date.now() - lastAct < 90000) { S.doc.seconds_spent = (S.doc.seconds_spent || 0) + 5; } }, 5000);
window.addEventListener("beforeunload", e => { if (S.dirty) { saveDoc(); e.preventDefault(); e.returnValue = ""; } });

(async function init() {
  const sd = ls.get("showDesc", true); $("#chkDesc").checked = sd; document.body.classList.toggle("showDesc", sd);
  showWelcome(); renderPane();
  if (window.showDirectoryPicker) await tryReopen();
})();
window.__VM = {S, quickAdd, parsePrice, extractPrices, validate, toCSV, useRoot};
</script>
</body>
</html>
