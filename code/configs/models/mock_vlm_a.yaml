# Test double: OpenAI-compatible mock server (smv.backends.mock_server). Never downloads anything.
key: mock_vlm_a
role: vlm
tier: test
backend: mock
family: Mock
dtype: null
thinking: {supported: true, default_on: false, "off": {chat_template_kwargs: {enable_thinking: false}}, "on": {chat_template_kwargs: {enable_thinking: true}}}
vllm: {max_num_seqs: 4, max_model_len: 8192}
autotune: {max_num_seqs: [4, 2, 1], max_model_len: [8192]}
mock:
  fake_weights_mb: 2
  env: {MOCK_GOLD_MAP: "{out_dir}/mock_gold_map.json", MOCK_BAD_JSON_EVERY: "7", MOCK_REPEAT_EVERY: "11", MOCK_TRUNCATE_EVERY: "13", MOCK_THINK: "1", MOCK_LATENCY: "0.05"}
