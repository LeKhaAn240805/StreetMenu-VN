key: ocr_ppocr
family: PaddleOCR PP-OCRv5
org: Baidu
license: apache-2.0
gated: false
download_gb: 0.6
role: ocr
groups:
- G5
tier: pilot
priority: 1
backend: ocr
text_only: false
keep_weights: false
enabled: true
note: 'baseline bắt buộc: OCR + regex + ghép dòng'
vllm:
  max_model_len: 16384
  max_num_seqs: 8
  gpu_memory_utilization: 0.9
  trust_remote_code: false
  enforce_eager: false
  extra_args: []
  env: {}
autotune:
  max_num_seqs:
  - 16
  - 8
  - 4
  - 2
  - 1
  max_model_len:
  - 16384
  - 12288
  - 8192
  mm_processor_kwargs: []
  preemption_limit: 200
thinking:
  supported: false
  default_on: false
  'off': {}
  'on': {}
  strip:
  - <think>
  - </think>
sampling: {}
hf:
  adapter: generic
  model_class: AutoModelForImageTextToText
  batch_size: 4
  batch_ladder:
  - 4
  - 2
  - 1
  python: main
  dtype: bfloat16
ocr:
  engine: paddleocr
  prompt: 'OCR:'
  output: text
  lang: vi
  max_tokens: 8192
  options: {}
mock: {}
